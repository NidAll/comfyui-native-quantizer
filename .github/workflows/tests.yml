name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install environment-supplied CPU PyTorch
        run: python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Install core and native layout dependencies
        run: python -m pip install -e '.[hub,kitchen]'
      - name: Core, CLI, architecture, metadata, packing and failure paths
        run: python scripts/check.py

  distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'build>=1.2' 'twine>=5'
      - name: Build wheels from complete source archives
        run: |
          python -m build --outdir dist
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          python scripts/check_distributions.py dist
      - name: Fresh dependency installation without PyTorch or the source checkout
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/installed/bin/python" -m pip check
          cp scripts/smoke_installed.py "$RUNNER_TEMP/smoke_installed.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/python" smoke_installed.py
      - name: Installed typed API conversion and independent output verification
        run: |
          "$RUNNER_TEMP/installed/bin/python" -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed/bin/python" smoke_installed.py --compute
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
