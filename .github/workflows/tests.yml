name: Tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU PyTorch and required dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Install native layout tests on Python 3.12
        if: matrix.python == '3.12'
        run: python -m pip install 'comfy-kitchen>=0.2.33' huggingface-hub
      - name: Compile
        run: python -m py_compile comfyui_native_quantizer.py
      - name: Embedded self-tests
        run: python comfyui_native_quantizer.py --self-test
      - name: External regression tests
        run: python -m unittest -v test_quantizer_native.py
